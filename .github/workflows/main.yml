name: FIRST ACTION
env:
  GLOB_ENV: "glob-env-value"
  OWNER: "Dima"

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - run: date +%H%M%S

      - name: say hello
        run: echo "HELLO from GitActions"

      - name: see folder
        run: |
          ls -la
          pwd
          env

      - name: multyline commands
        run: |
          echo "My GLOB_ENV: ${{ env.GLOB_ENV }}"
          echo "Stam text to file" >> stam.txt
          ls -la

      - run: cat stam.txt

  job-2:
    runs-on: ubuntu-latest
    steps:
      - run: date +%H%M%S

      - name: say goodbye
        run: echo "goodbye from GitActions"

      - name: list folder
        run: ls -la

      - run: echo " this action was triggered by ${{ github.action }}"
