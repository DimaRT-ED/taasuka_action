name: FIRST ACTION
env:
  GLOB_ENV: "glob-env-value"
  OWNER: "Dima"

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - run: date +%H%M%S

      - name: say hello
        run: echo "HELLO from GitActions"

      - uses: actions/checkout@v4

      - name: see folder
        run: |
          ls -la
          pwd
          env

      - name: multyline commands
        run: |
          echo "My GLOB_ENV: ${{ env.GLOB_ENV }}"
          echo "Stam text to file" >> stam.txt
          ls -la

      - run: cat stam.txt

      - name: RUN TEST
        run: |
          chmod +x ./test.sh
          sh ./test.sh

  job-2:
    runs-on: ubuntu-latest
    needs: ["job-1"]

    env:
      VAR1: "var-1-value"
      VAR2: "value-2-var"

    steps:
      - run: date +%H%M%S

      - name: say goodbye
        run: echo "goodbye from GitActions"

      - name: list folder
        run: ls -la

      - run: |
          echo "VAR1 :  ${{ env.VAR1 }},   VAR2 :  ${{ env.VAR2 }}"
          echo " This is local variable  LOCAL_VAR : $LOCAL_VAR"
        env:
          LOCAL_VAR: "local_variable"

      - run: echo " this action was triggered by ${{ github.action }}"
